<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ultimate OSINT</title>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>

<header>
  <div id="header-left">
    <span id="logo">&#9679; ULTIMATE OSINT</span>
    <span id="tagline">Passive Intelligence Gathering</span>
  </div>
  <div id="header-right">
    <div id="api-keys">
      {% for key, active in api_keys.items() %}
      <span class="key-badge {{ 'active' if active else 'inactive' }}" title="{{ key }}">
        {{ key }}
      </span>
      {% endfor %}
    </div>
    <button id="cache-btn" title="Cache stats">&#128190; Cache</button>
  </div>
</header>

<div id="layout">

  <!-- ===== LEFT PANEL ===== -->
  <aside id="panel">

    <div id="tabs">
      <button class="tab active" data-tab="domain">Domain</button>
      <button class="tab" data-tab="ip">IP</button>
      <button class="tab" data-tab="email">Email</button>
      <button class="tab" data-tab="phone">Phone</button>
      <button class="tab" data-tab="username">Username</button>
      <button class="tab" data-tab="person">Person</button>
      <button class="tab" data-tab="breach">Breach</button>
      <button class="tab tab-full" data-tab="full">Full &#9889;</button>
    </div>

    <!-- ===== DOMAIN ===== -->
    <form id="form-domain" class="scan-form active" data-module="domain">
      <div class="field">
        <label>Domain / URL</label>
        <input type="text" name="target" placeholder="example.com" required autocomplete="off"/>
      </div>
      <div class="tools-section">
        <div class="tools-header" onclick="toggleTools(this)">
          <span>Tools</span><span class="tools-arrow">&#9660;</span>
        </div>
        <div class="tools-grid">
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="whois" checked> WHOIS</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="dns" checked> DNS</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="crtsh" checked> crt.sh</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="wayback" checked> Wayback</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="ip_geo" checked> IP Geo</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hackertarget" checked> HackerTarget</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="urlscan" checked> URLScan</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="threatfox" checked> ThreatFox</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="urlhaus" checked> URLHaus</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="alienvault" checked> AlienVault</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="virustotal" checked> VirusTotal</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="censys" checked> Censys</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="securitytrails" checked> SecurityTrails</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="shodan" checked> Shodan</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hunter" checked> Hunter.io</label>
        </div>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Scan Domain</button>
    </form>

    <!-- ===== IP ===== -->
    <form id="form-ip" class="scan-form" data-module="ip">
      <div class="field">
        <label>IP Address</label>
        <input type="text" name="ip" placeholder="1.1.1.1" required autocomplete="off"/>
      </div>
      <div class="tools-section">
        <div class="tools-header" onclick="toggleTools(this)">
          <span>Tools</span><span class="tools-arrow">&#9660;</span>
        </div>
        <div class="tools-grid">
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="ip_geo" checked> IP Geo</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="ipinfo" checked> IPInfo</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="bgpview" checked> BGPView</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hackertarget" checked> HackerTarget</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="greynoise" checked> GreyNoise</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="threatfox" checked> ThreatFox</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="abuseipdb" checked> AbuseIPDB</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="virustotal" checked> VirusTotal</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="shodan" checked> Shodan</label>
        </div>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Investigate IP</button>
    </form>

    <!-- ===== EMAIL ===== -->
    <form id="form-email" class="scan-form" data-module="email">
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="target@example.com" required autocomplete="off"/>
      </div>
      <div class="tools-section">
        <div class="tools-header" onclick="toggleTools(this)">
          <span>Tools</span><span class="tools-arrow">&#9660;</span>
        </div>
        <div class="tools-grid">
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="emailrep" checked> EmailRep</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="gravatar" checked> Gravatar</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hunter_email" checked> Hunter.io</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="intelx" checked> IntelX</label>
        </div>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Investigate Email</button>
    </form>

    <!-- ===== PHONE ===== -->
    <form id="form-phone" class="scan-form" data-module="phone">
      <div class="field">
        <label>Phone number (E.164)</label>
        <input type="text" name="number" placeholder="+33612345678" required autocomplete="off"/>
      </div>
      <div class="tools-section">
        <div class="tools-header" onclick="toggleTools(this)">
          <span>Tools</span><span class="tools-arrow">&#9660;</span>
        </div>
        <div class="tools-grid">
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="local" checked> Analysis</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="numverify" checked> NumVerify</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="abstractapi" checked> AbstractAPI</label>
        </div>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Scan Phone</button>
    </form>

    <!-- ===== USERNAME ===== -->
    <form id="form-username" class="scan-form" data-module="username">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="johndoe" required autocomplete="off"/>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Hunt Username</button>
    </form>

    <!-- ===== PERSON ===== -->
    <form id="form-person" class="scan-form" data-module="person">
      <div class="field">
        <label>First name</label>
        <input type="text" name="first" placeholder="John" required autocomplete="off"/>
      </div>
      <div class="field">
        <label>Last name</label>
        <input type="text" name="last" placeholder="Doe" required autocomplete="off"/>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Investigate Person</button>
    </form>

    <!-- ===== BREACH ===== -->
    <form id="form-breach" class="scan-form" data-module="breach">
      <div class="field">
        <label>Email address</label>
        <input type="email" name="email" placeholder="target@example.com" required autocomplete="off"/>
      </div>
      <div class="tools-section">
        <div class="tools-header" onclick="toggleTools(this)">
          <span>Tools</span><span class="tools-arrow">&#9660;</span>
        </div>
        <div class="tools-grid">
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hibp" checked> HIBP</label>
          <label class="tool-label"><input type="checkbox" class="tool-cb" value="hibp_pastes" checked> HIBP Pastes</label>
        </div>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan">Check Breaches</button>
    </form>

    <!-- ===== FULL ===== -->
    <form id="form-full" class="scan-form" data-module="full">
      <div class="field">
        <label>Domain / URL <span class="opt">optional</span></label>
        <input type="text" name="target" placeholder="example.com" autocomplete="off"/>
      </div>
      <div class="field">
        <label>IP <span class="opt">optional</span></label>
        <input type="text" name="ip" placeholder="1.2.3.4" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Email <span class="opt">optional</span></label>
        <input type="email" name="email" placeholder="target@example.com" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Username <span class="opt">optional</span></label>
        <input type="text" name="username" placeholder="johndoe" autocomplete="off"/>
      </div>
      <div class="field-row">
        <div class="field" style="flex:1">
          <label>First <span class="opt">optional</span></label>
          <input type="text" name="first" placeholder="John" autocomplete="off"/>
        </div>
        <div class="field" style="flex:1">
          <label>Last <span class="opt">optional</span></label>
          <input type="text" name="last" placeholder="Doe" autocomplete="off"/>
        </div>
      </div>
      <div class="field">
        <label>Phone <span class="opt">optional</span></label>
        <input type="text" name="phone" placeholder="+33612345678" autocomplete="off"/>
      </div>
      <div class="field-row">
        <label class="checkbox-label"><input type="checkbox" name="no_cache"/> Force refresh</label>
      </div>
      <button type="submit" class="btn-scan btn-full">Full OSINT Sweep &#9889;</button>
    </form>

    <!-- History -->
    <div id="history-block">
      <div id="history-title">Recent scans</div>
      <div id="history-list"></div>
    </div>

  </aside>

  <!-- ===== RESULTS PANEL ===== -->
  <main id="results">
    <div id="results-placeholder">
      <div id="placeholder-icon">&#9679;</div>
      <div id="placeholder-text">Enter a target and launch a scan</div>
    </div>
    <div id="results-content" style="display:none"></div>
  </main>

</div>

<!-- Modal cache -->
<div id="cache-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">&#128190; Cache</div>
    <div id="cache-stats-content">Loading...</div>
    <div class="modal-actions">
      <button id="cache-clear-btn" class="btn-danger">Clear all</button>
      <button id="cache-close-btn">Close</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
